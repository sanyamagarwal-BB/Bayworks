<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | BAYWORKS</title>
  <meta name="theme-color" content="#059669" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8faf9; color: #0f172a; text-align: center; padding: 2rem;
    }
    .card { max-width: 420px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 16px;
      background: #059669; color: #fff; display: grid; place-items: center;
      font-size: 2rem; font-weight: 800;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #475569; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
      background: #059669; color: #fff; padding: .7rem 1.4rem;
    }
    button:focus-visible { outline: 2px solid #065F46; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">B</div>
    <h1>You're offline</h1>
    <p>We can't reach BAYWORKS right now. Check your connection and try again — pages you've already visited stay available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
