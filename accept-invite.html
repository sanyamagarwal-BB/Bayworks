<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Workspace | BAYWORKS</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <aside class="auth-aside" aria-hidden="true">
      <a href="/" class="auth-logo"><span class="logo-text">BAYWORKS<sup class="logo-tm">™</sup></span></a>
      <div class="auth-aside-body">
        <p class="label-pill label-pill-white">Client Portal</p>
        <h1 class="auth-aside-h">Join your<br>team's workspace.</h1>
      </div>
      <p class="auth-aside-foot">You'll share the same shortlist, proposals and site visits as your colleagues.</p>
    </aside>

    <section class="auth-main">
      <a href="/login.html" class="auth-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to sign in
      </a>
      <div class="auth-toast" id="toast" role="status" aria-live="polite"></div>
      <form class="auth-form is-active" id="form-accept" novalidate>
        <header class="auth-form-head"><h2>Accept invitation</h2><p id="ai-sub">Set up your account to join the workspace.</p></header>
        <div class="form-row">
          <label for="ai-name">Your name</label>
          <input type="text" id="ai-name" autocomplete="name" placeholder="Full name" required />
          <small class="field-err" data-err="ai-name"></small>
        </div>
        <div class="form-row">
          <label for="ai-pass">Create a password</label>
          <div class="input-pass">
            <input type="password" id="ai-pass" autocomplete="new-password" placeholder="At least 8 characters" required />
            <button type="button" class="pass-toggle" aria-label="Show password" data-target="ai-pass">
              <svg class="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" style="display:none"><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M6.6 6.6A18 18 0 0 0 2 11s3.5 7 10 7a10.9 10.9 0 0 0 4.1-.8"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <small class="field-err" data-err="ai-pass"></small>
        </div>
        <button type="submit" class="btn-primary btn-block" id="ai-submit"><span class="btn-label">Join workspace</span><span class="btn-spinner" aria-hidden="true"></span></button>
      </form>
    </section>
  </main>
  <script type="module" src="/src/accept-invite.js"></script>
</body>
</html>
