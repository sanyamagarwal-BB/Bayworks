# ──────────────────────────────────────────────────────────────────────────
# BAYWORKS — GitHub Actions CI (mirror of .gitlab-ci.yml)
#
# Same three execution modes, GitHub's equivalents:
#   • SEQUENTIAL   → `needs:` chains (lint → build → test)
#   • PARALLEL     → independent jobs with no `needs` start together
#   • OUT OF ORDER → `needs:` DAG: build-web waits only on lint-web, not lint-api
#
# Deploy to GitHub Pages stays in deploy.yml. This file is lint/build/test
# plus a manual production gate.
# ──────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # enables the manual production gate below

jobs:
  # ═══════════════════════ lint (parallel — no needs) ═════════════════════
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crm/web/package-lock.json
      - run: npm ci
        working-directory: crm/web
      - run: npx tsc --noEmit
        working-directory: crm/web

  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crm/api/package-lock.json
      - run: npm ci
        working-directory: crm/api
      - run: npx prisma generate          # Prisma client types before type-check
        working-directory: crm/api
      - run: npx tsc --noEmit
        working-directory: crm/api

  # Row 9: security scan, parallel with lint. Non-blocking.
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm audit --audit-level=high || true
      - run: cd crm/web && npm audit --audit-level=high || true
      - run: cd crm/api && npm audit --audit-level=high || true

  # ═══════════════════════ build ═════════════════════════════════════════
  build-site:
    runs-on: ubuntu-latest        # no needs → runs in parallel with lint jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: site-dist, path: dist/ }

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-web]             # OUT OF ORDER: waits only on lint-web, not lint-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: crm/web/package-lock.json }
      - run: npm ci
        working-directory: crm/web
      - run: npm run build           # tsc && vite build
        working-directory: crm/web
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: crm/web/dist/ }

  build-api:
    runs-on: ubuntu-latest
    needs: [lint-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: crm/api/package-lock.json }
      - run: npm ci
        working-directory: crm/api
      - run: npx prisma generate
        working-directory: crm/api
      - run: npm run build           # nest build
        working-directory: crm/api

  # ═══════════════════════ test (parallel, real DB) ══════════════════════
  # Each job runs a Postgres service container, boots the seeded API via the
  # shared bootstrap script, then runs its tests. The bootstrap + test share
  # ONE shell step so the backgrounded API stays alive for the test command.
  e2e-web:
    runs-on: ubuntu-latest
    needs: [build-web]            # DAG: starts right after build-web
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bayworks, POSTGRES_PASSWORD: bayworks, POSTGRES_DB: bayworks_crm }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bayworks" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bayworks:bayworks@localhost:5432/bayworks_crm?schema=public
      JWT_SECRET: ci-test-secret
      PORT: '6002'
      CORS_ORIGIN: http://localhost:6001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Boot API + run e2e
        run: |
          (cd crm/api && npm ci)
          bash crm/api/scripts/ci-bootstrap.sh          # starts API on :6002
          (cd crm/web && npm ci && npx playwright install --with-deps chromium && npm run test:e2e)
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: crm/web/test-results/ }

  smoke-api:
    runs-on: ubuntu-latest
    needs: [build-api]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bayworks, POSTGRES_PASSWORD: bayworks, POSTGRES_DB: bayworks_crm }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bayworks" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bayworks:bayworks@localhost:5432/bayworks_crm?schema=public
      JWT_SECRET: ci-test-secret
      PORT: '6002'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Boot API + smoke
        run: |
          (cd crm/api && npm ci)
          bash crm/api/scripts/ci-bootstrap.sh
          (cd crm/api && npm run test:smoke)

  # Non-blocking: the suite intentionally trips the login throttle.
  suite-api:
    runs-on: ubuntu-latest
    needs: [build-api]
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bayworks, POSTGRES_PASSWORD: bayworks, POSTGRES_DB: bayworks_crm }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bayworks" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bayworks:bayworks@localhost:5432/bayworks_crm?schema=public
      JWT_SECRET: ci-test-secret
      PORT: '6002'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Boot API + suite
        run: |
          (cd crm/api && npm ci)
          bash crm/api/scripts/ci-bootstrap.sh
          (cd crm/api && npm run test:suite)

  # ═══════════════════════ production gate (row 7) ════════════════════════
  # Manual: only via "Run workflow", on main, and only after builds pass.
  # Add a `production` environment with required reviewers in repo settings
  # to enforce human approval before this runs.
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-site, build-web, build-api]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.bayworks.in
    steps:
      - run: echo "Deploying to production… (wire real deploy target + secrets here)"
