<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Portal | BAYWORKS</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="dash-body">
  <header class="dash-top">
    <a href="/" class="auth-logo"><span class="logo-text" style="color:var(--ink)">BAYWORKS<sup class="logo-tm">™</sup></span></a>
    <nav class="dash-top-nav">
      <a href="/properties.html">Browse Properties</a>
      <a href="/about.html">About</a>
    </nav>
    <div class="dash-account">
      <span class="dash-avatar" id="dash-avatar">P</span>
      <span class="dash-account-name" id="dash-name">Partner</span>
      <button class="btn-ghost dash-logout" id="dash-logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="dash-shell container">
    <section class="dash-hello">
      <p class="label-pill">Channel Partner Portal</p>
      <h1 class="dash-h1">Welcome, <span id="dash-firstname">Partner</span> <span id="dash-status" class="dash-tag" style="vertical-align:middle"></span></h1>
      <p class="dash-sub">Your referred deals and commission status with BayWorks.</p>
    </section>

    <section class="dash-stats" id="dash-stats"></section>

    <div class="dash-grid">
      <section class="dash-card dash-card-wide">
        <div class="dash-card-head"><h2>Your referred leads</h2></div>
        <ul class="dash-list" id="dash-leads"></ul>
      </section>
      <section class="dash-card">
        <div class="dash-card-head"><h2>Commissions</h2></div>
        <ul class="dash-list" id="dash-commissions"></ul>
      </section>
      <section class="dash-card">
        <div class="dash-card-head"><h2>Your profile</h2></div>
        <dl class="dash-profile" id="dash-profile"></dl>
        <a href="https://wa.me/919205005399" target="_blank" rel="noopener" class="btn-primary btn-block" style="margin-top:1rem">Talk to your BayWorks contact</a>
      </section>
    </div>
  </main>

  <script type="module" src="/src/partner-dashboard.js"></script>
</body>
</html>
